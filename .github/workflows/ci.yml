name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

# Pages is served from the gh-pages branch (Settings > Pages > Deploy from
# a branch). The actions-based deploy path (deploy-pages) hung server-side
# on 2026-08-06, so the verify job pushes the built site to that branch.
permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_PUSH_API: https://blockcast-push.sandy-p-scullion.workers.dev
          VITE_VAPID_PUBLIC_KEY: BIZXZtVGnG74VkCQBzHCOceJbJmKQXdDhXFxf12316nrY_yrq-mIsqAnbMjn8xtTawbxosm5vk8exSnEwrLg9c0
      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd app/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
