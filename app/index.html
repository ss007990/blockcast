    <script>
      // GoatCounter analytics (privacy-friendly, no cookies) — website only.
      // The native app skips it entirely so its App Privacy label stays
      // "Data Not Collected" (Capacitor serves from capacitor://localhost).
      // Visit the site once with #skipgc in the URL to exclude your own device.
      if (window.location.hash === '#skipgc') localStorage.setItem('skipgc', 't');
      if (window.location.protocol.startsWith('http')) {
        // Forecast links count as /shared/<sport> (a person shared a place)
        // or /sport/<sport> (a post or landing page). The app strips the
        // link's keys on load (services/share.ts) and leaves window.__bcShared
        // behind, so the count survives whichever script runs first.
        window.goatcounter = {
          no_onload: localStorage.getItem('skipgc') === 't',
          path: function (p) {
            if (window.__bcShared) return '/' + window.__bcShared;
            var q = window.location.search;
            var m = /[?&]a=([a-z]+)/.exec(q);
            if (!m && !/[?&]at=/.test(q)) return p;
            return '/' + (/[?&]at=/.test(q) ? 'shared' : 'sport') + '/' + (m ? m[1] : 'any');
          },
        };
        var gc = document.createElement('script');
        gc.async = true;
        gc.src = 'https://gc.zgo.at/count.js';
        gc.setAttribute('data-goatcounter', 'https://blockcast.goatcounter.com/count');
        document.body.appendChild(gc);
      }
    </script>
