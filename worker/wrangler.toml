name = "blockcast-push"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# KV namespace holding push subscriptions. Create with:
#   npx wrangler kv namespace create SUBS
# then paste the id below.
kv_namespaces = [
  { binding = "SUBS", id = "7d9f27b3c92d45c1a278a5b00614f496" }
]

# Re-check subscribed sessions every 3 hours.
[triggers]
crons = ["0 */3 * * *"]

[vars]
ALLOWED_ORIGINS = "https://blockcast.ca,http://localhost:5173,capacitor://localhost"
APNS_TOPIC = "ca.blockcast.app"
# "sandbox" for Xcode development builds; MUST flip to "production" before the
# first TestFlight build (TestFlight device tokens are production-environment).
APNS_ENV = "sandbox"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   VAPID_PUBLIC_KEY   — base64url public key  (npx web-push generate-vapid-keys)
#   VAPID_PRIVATE_KEY  — base64url private key
#   VAPID_SUBJECT      — e.g. "mailto:sandy.p.scullion@gmail.com"
#   APNS_PRIVATE_KEY   — contents of the AuthKey_<KEYID>.p8 from developer.apple.com
#   APNS_KEY_ID        — the key's 10-char id
#   APNS_TEAM_ID       — Apple Developer Team ID (membership page)
