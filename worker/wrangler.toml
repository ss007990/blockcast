name = "blockcast-push"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# KV namespace holding push subscriptions. Create with:
#   npx wrangler kv namespace create SUBS
# then paste the id below.
kv_namespaces = [
  { binding = "SUBS", id = "7d9f27b3c92d45c1a278a5b00614f496" }
]

# Re-check subscribed sessions every 3 hours.
[triggers]
crons = ["0 */3 * * *"]

[vars]
ALLOWED_ORIGINS = "https://blockcast.ca,http://localhost:5173,capacitor://localhost"
# Billed Rainbow tiles per day before /api/rain/tile starts answering 429.
# Cache hits are free and never counted. At ~418 tiles per radar view that is
# roughly a dozen uncached views a day; Rainbow bills $0.20/1000 beyond a
# 30,000/month free allowance, so this caps the worst month near $24.
RAIN_TILE_BUDGET = "5000"
APNS_TOPIC = "ca.blockcast.app"
# "production" for TestFlight/App Store builds (their device tokens are
# production-environment). Flip back to "sandbox" only for local Xcode dev pushes.
APNS_ENV = "production"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   VAPID_PUBLIC_KEY   — base64url public key  (npx web-push generate-vapid-keys)
#   VAPID_PRIVATE_KEY  — base64url private key
#   VAPID_SUBJECT      — e.g. "mailto:sandy.p.scullion@gmail.com"
#   APNS_PRIVATE_KEY   — contents of the AuthKey_<KEYID>.p8 from developer.apple.com
#   APNS_KEY_ID        — the key's 10-char id
#   APNS_TEAM_ID       — Apple Developer Team ID (membership page)
#   WINDY_API_KEY      — free key from https://api.windy.com/keys (Webcams API);
#                        nearby cams return 503 until it is set
#   XWEATHER_ID        — Xweather (Vaisala) client id, from the account's Apps page
#   XWEATHER_SECRET    — matching client secret; premium radar frames stay off
#                        until both are set
